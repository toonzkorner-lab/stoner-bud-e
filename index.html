<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07110c" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&family=Outfit:wght@400..800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved garden theme before first paint (no flash of default).
      try {
        var t = localStorage.getItem('bude-theme-v1');
        if (t === 'night' || t === 'day' || t === 'ember' || t === 'moon') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) {}
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bud-E" />
    <meta
      name="description"
      content="Stoner Bud-E — your 21+ cannabis session buddy. Chat, timers, and a plan for tonight. Start low, go slow."
    />
    <title>Stoner Bud-E</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
